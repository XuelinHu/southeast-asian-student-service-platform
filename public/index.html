<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：刘海屏下让页面铺满，配合 CSS 的 safe-area 内边距
         interactive-widget=resizes-content：软键盘弹出时压缩视口而不是盖住输入框 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>面向国际留学生的信息管理系统</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/portal.css" />
    <link rel="stylesheet" href="/agent.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="systemTag">V1.0 留学生信息管理系统</p>
        <h1 data-i18n="systemName">面向国际留学生的信息管理系统</h1>
      </div>
      <div class="toolbar">
        <button class="icon-button" id="langToggle" title="Language">中 / EN</button>
        <a class="ghost-button button-link hidden" id="adminLink" href="/admin.html" data-i18n="adminConsole">管理台</a>
        <button class="ghost-button hidden" id="logoutBtn" data-i18n="logout">退出</button>
      </div>
    </header>

    <main class="layout">
      <!-- ------------------------------------------------------- 未登录 -->
      <section class="auth-area" id="authArea">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" data-panel="login" data-i18n="loginTitle">用户登录</button>
            <button class="auth-tab" data-panel="register" data-i18n="registerTitle">注册账号</button>
          </div>

          <form id="loginForm" class="form-grid auth-panel">
            <p class="muted auth-hint" data-i18n="loginHint">学生、教师和管理员使用统一入口登录。</p>
            <label>
              <span data-i18n="username">账号</span>
              <input name="username" autocomplete="username" value="student01" required />
            </label>
            <label>
              <span data-i18n="password">密码</span>
              <input name="password" type="password" autocomplete="current-password" value="Admin@123" required />
            </label>
            <button class="primary-button" type="submit" data-i18n="loginButton">登录系统</button>
            <p class="message" id="loginMessage"></p>
          </form>

          <form id="registerForm" class="form-grid auth-panel hidden">
            <p class="muted auth-hint" data-i18n="registerHintStudent">
              填写学号可同时建立学生档案，留空则只创建登录账号。
            </p>
            <label>
              <span data-i18n="username">账号</span>
              <input name="username" autocomplete="username" placeholder="3-32 位字母、数字、下划线" required />
            </label>
            <label>
              <span data-i18n="displayName">姓名</span>
              <input name="displayName" required />
            </label>
            <div class="form-row">
              <label>
                <span data-i18n="password">密码</span>
                <input name="password" type="password" autocomplete="new-password" required />
              </label>
              <label>
                <span data-i18n="confirmPassword">确认密码</span>
                <input name="confirmPassword" type="password" autocomplete="new-password" required />
              </label>
            </div>
            <div class="form-row">
              <label>
                <span data-i18n="studentNo">学号（选填）</span>
                <input name="studentNo" />
              </label>
              <label>
                <span data-i18n="englishName">英文姓名</span>
                <input name="englishName" />
              </label>
            </div>
            <div class="form-row">
              <label>
                <span data-i18n="email">邮箱</span>
                <input name="email" type="email" />
              </label>
              <label>
                <span data-i18n="phone">手机号</span>
                <input name="phone" />
              </label>
            </div>
            <button class="primary-button" type="submit" data-i18n="registerButton">注册</button>
            <p class="message" id="registerMessage"></p>
          </form>
        </div>
      </section>

      <!-- ------------------------------------------------------- 已登录 -->
      <section class="workspace hidden" id="workspace">
        <nav class="tabs" id="tabs"></nav>
        <section class="summary-grid" id="summaryGrid"></section>
        <section class="content-grid">
          <article class="surface" id="primaryView"></article>
          <aside class="surface compact" id="sideView"></aside>
        </section>
      </section>
    </main>

    <script type="module" src="/js/portal.js"></script>
    <script type="module" src="/js/agent.js"></script>
  </body>
</html>
