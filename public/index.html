<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>International Student Information Platform</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="systemTag">V1.0 留学生信息管理系统</p>
        <h1 data-i18n="systemName">面向国际留学生的信息管理系统</h1>
      </div>
      <div class="toolbar">
        <button class="icon-button" id="langToggle" title="Language">中 / EN</button>
        <button class="ghost-button hidden" id="logoutBtn" data-i18n="logout">退出</button>
      </div>
    </header>

    <main class="layout">
      <section class="login-panel" id="loginPanel">
        <div class="panel-title">
          <h2 data-i18n="loginTitle">用户登录</h2>
          <p data-i18n="loginHint">学生、教师和管理员使用统一入口登录。</p>
        </div>
        <form id="loginForm" class="form-grid">
          <label>
            <span data-i18n="username">账号</span>
            <input name="username" autocomplete="username" value="student01" required />
          </label>
          <label>
            <span data-i18n="password">密码</span>
            <input name="password" type="password" autocomplete="current-password" value="Admin@123" required />
          </label>
          <button class="primary-button" type="submit" data-i18n="loginButton">登录系统</button>
          <p class="message" id="loginMessage"></p>
        </form>
        <div class="demo-users">
          <span data-i18n="demoUsers">演示账号</span>
          <code>student01 / ******</code>
          <code>teacher01 / ******</code>
          <code>student001 / ******</code>
          <code>admin / ******</code>
        </div>
      </section>

      <section class="workspace hidden" id="workspace">
        <nav class="tabs" id="tabs"></nav>

        <section class="summary-grid" id="summaryGrid"></section>

        <section class="content-grid">
          <article class="surface" id="primaryView"></article>
          <aside class="surface compact" id="sideView"></aside>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
